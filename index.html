    <!-- The pre-rendered hero (scripts/prerender.mjs) waits for the intro
         animation instead of showing and then re-animating. App removes
         data-prerendered once the intro has set its start state; if the JS
         never runs, the content still appears after 4 s. -->
    <style>
      @keyframes prerender-reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: no-preference) {
        #root[data-prerendered] header,
        #root[data-prerendered] [data-intro] { opacity: 0; animation: prerender-reveal 0s 4s forwards; }
      }
    </style>
